name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  no-mock:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_no_mock.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # the data smoke test reads the generated web/public/data and runs scripts/check_data_budget.py
      - run: npm run data:sync
      - run: npm test

  # End-to-end smoke suite on the production build, bundle budgets and the release gate expectation.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r ../requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run data:sync
      - run: python ../scripts/build_references.py
      - run: npm run build
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      - run: npm run check:bundle
      # While the data is mock the release build must fail because of the mock. Delete this step at the same time
      # the release gate starts passing (docs/release-checklist.md, item 1).
      - name: Release gate fails on mock data
        working-directory: .
        run: |
          python scripts/expect_failure.py npm --prefix web run build:release --stdout-contains "File contains source: MOCK"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e/screenshots
          if-no-files-found: warn

  # The release gate: only for version tags and by hand. Runs every check against the release build and keeps the site.
  # It fails while any gate fails (mock data, placeholder content or metadata, missing og.png or favicon). The expected
  # failure step of the pull request job is not part of it.
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python scripts/precheck.py
      - run: npm run data:sync
        working-directory: web
      - run: npm run build:release
        working-directory: web
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      - run: npm run check:bundle
        working-directory: web
      # the build above is the release build: the e2e suite serves it as it is
      - run: npx playwright test
        working-directory: web
        env:
          E2E_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  terrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            scripts/terrain/requirements.txt
      - run: pip install -r requirements-dev.txt -r scripts/terrain/requirements.txt
      - run: python -m pytest -q scripts/terrain/tests

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_data.py

